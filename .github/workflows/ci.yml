name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: support_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/support_test
      TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/support_test
      CMAKE_ARGS: -DVECSEARCH_ARCH=x86-64-v3 -DVECSEARCH_BUILD_TESTS=OFF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "vecsearch @ git+https://github.com/Manojkaipu/vecsearch.git"
          pip install -e ".[dev]"
      - run: python -m pytest -q tests

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/support-rag
      - run: helm template rag deploy/helm/support-rag > /dev/null

  images:
    runs-on: ubuntu-24.04
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: Manojkaipu/vecsearch, path: vecsearch-src }
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --build-context vecsearch=vecsearch-src -t support-rag-api:ci .
      - run: docker buildx build -t support-rag-web:ci web
