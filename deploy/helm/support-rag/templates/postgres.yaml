{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres" }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels: {{- include "rag.labels" . | nindent 4 }}
type: Opaque
data:
  # keep the generated password across upgrades
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  selector: {{- include "rag.selector" "postgres" | nindent 4 }}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "rag.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rag.selector" "postgres" | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
