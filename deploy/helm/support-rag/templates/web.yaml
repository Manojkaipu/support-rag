apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "rag.selector" "web" | nindent 4 }}
  ports:
    - port: 3000
      nodePort: {{ .Values.web.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "rag.selector" "web" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "rag.selector" "web" | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: API_URL
              value: http://api:8000
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
