images:
  api: support-rag-api:dev
  web: support-rag-web:dev
  pullPolicy: IfNotPresent  # images are side-loaded with `kind load docker-image`

# Directory on the node holding the indexes and parquet files (data/ from the ingest step).
data:
  hostPath: /data

llm:
  provider: xai  # xai | anthropic
  # kubectl create secret generic llm-keys --from-literal=XAI_API_KEY=...  (and/or ANTHROPIC_API_KEY)
  existingSecret: llm-keys
  agentModel: ""  # empty: the provider's default (grok-4.7 / claude-opus-5)
  verifierModel: ""

postgres:
  image: postgres:18
  user: rag
  database: support
  storage: 5Gi

api:
  replicas: 1
  resources:
    requests: { cpu: 500m, memory: 3Gi }
    limits: { memory: 5Gi }

web:
  replicas: 1
  nodePort: 30080

ingest:
  enabled: true  # post-install Job that loads Postgres from the parquet files

observability:
  enabled: true
  prometheus:
    image: prom/prometheus:v3.5.0
    nodePort: 30900
  grafana:
    image: grafana/grafana:12.1.1
    nodePort: 30300
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    nodePort: 30686
