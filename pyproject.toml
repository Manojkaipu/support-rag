[project]
name = "support-rag"
version = "0.1.0"
description = "Agentic question answering over customer-support conversations, built on vecsearch"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.2",
    "sentence-transformers>=3.0",
    "anthropic>=1.0",
    "vecsearch",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*"]
